name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm collect
      - uses: actions/upload-artifact@v7
        with:
          name: analysis-payload
          path: analysis/payload.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: python3 -m venv health/agent/.venv
      - run: health/agent/.venv/bin/pip install -e "health/agent/.[dev]"
      - run: pnpm test
      - run: pnpm arch
      - run: health/agent/.venv/bin/pytest health/agent

  publish-health:
    if: github.ref == 'refs/heads/main' && vars.WIF_PROVIDER != ''
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: analysis-payload
          path: analysis
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.HEALTH_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud pubsub topics publish "${{ vars.ANALYSIS_TOPIC }}" --message "$(jq -c . analysis/payload.json)"
