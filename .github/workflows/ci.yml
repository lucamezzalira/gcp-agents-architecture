name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: python3 -m venv health/agent/.venv
      - run: health/agent/.venv/bin/pip install -e "health/agent/.[dev]"
      - run: pnpm test
      - run: pnpm arch
      - run: health/agent/.venv/bin/pytest health/agent
      - run: pnpm collect
        continue-on-error: true

  publish-health:
    if: github.ref == 'refs/heads/main' && vars.WIF_PROVIDER != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.HEALTH_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm collect
      - run: gcloud pubsub topics publish "${{ vars.ANALYSIS_TOPIC }}" --message "$(cat analysis/payload.json)"
