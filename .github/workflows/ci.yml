name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Authenticate to Cloud Trace
        id: auth
        if: vars.WIF_PROVIDER != '' && vars.SERVICES_CI_SA != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SERVICES_CI_SA }}
      - name: Generate synthetic traffic
        id: smoke
        if: steps.auth.outcome == 'success'
        env:
          SERVICES_CI_SA: ${{ vars.SERVICES_CI_SA }}
        run: |
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          bash scripts/smoke-runtime.sh
          sleep 15
      - name: Collect analysis payload
        env:
          TRACE_PROJECT: ${{ steps.auth.outcome == 'success' && vars.TRACE_PROJECT || '' }}
          TRACE_TRAFFIC: ${{ steps.smoke.outcome == 'success' && 'this-run' || 'none' }}
          TRACE_WINDOW_START: ${{ steps.smoke.outputs.start }}
        run: pnpm collect
      - uses: actions/upload-artifact@v7
        with:
          name: analysis-payload
          path: analysis/payload.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: python3 -m venv health/agent/.venv
      - run: health/agent/.venv/bin/pip install -e "health/agent/.[dev]"
      - run: pnpm test
      - run: pnpm arch
      - run: health/agent/.venv/bin/pytest health/agent

  publish-health:
    if: github.ref == 'refs/heads/main' && vars.WIF_PROVIDER != ''
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: analysis-payload
          path: analysis
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.HEALTH_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud pubsub topics publish "${{ vars.ANALYSIS_TOPIC }}" --message "$(jq -c . analysis/payload.json)"
